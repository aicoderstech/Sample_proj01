<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600">
  <!-- Breton striped long sleeve in cotton jersey, boat neck. -->
  <defs>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="40" height="34">
      <rect width="40" height="34" fill="#f4efe4"/>
      <rect y="14" width="40" height="11" fill="#22406f"/>
    </pattern>
    <filter id="knit" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.45" numOctaves="2" seed="3" result="fine"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.02" numOctaves="3" seed="6" result="mottle"/>
      <feComposite in="fine" in2="mottle" operator="arithmetic" k2="0.55" k3="0.45" result="mix"/>
      <feColorMatrix in="mix" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 0.5" result="grey"/>
      <feComposite in="SourceGraphic" in2="grey" operator="arithmetic" k1="0.3" k2="0.925"/>
    </filter>
    <clipPath id="shape">
      <path d="M230,50 Q320,82 410,50 L470,80 L600,330 L550,350 L480,190 L478,560 Q320,568 162,560 L160,190 L90,350 L40,330 L170,80 Z"/>
    </clipPath>
  </defs>
  <g filter="url(#knit)">
    <path d="M230,50 Q320,82 410,50 L470,80 L600,330 L550,350 L480,190 L478,560 Q320,568 162,560 L160,190 L90,350 L40,330 L170,80 Z" fill="url(#stripes)"/>
    <g clip-path="url(#shape)" fill="none">
      <!-- boat-neck facing -->
      <path d="M230,50 Q320,82 410,50" stroke="#22406f" stroke-width="9"/>
      <path d="M228,58 Q320,92 412,58" stroke="#1a3359" stroke-width="1.2" stroke-dasharray="3 1.6" stroke-opacity="0.7"/>
      <!-- sleeve seams -->
      <path d="M170,80 C164,120 161,160 160,190 M470,80 C476,120 479,160 480,190" stroke="#8f8a80" stroke-width="1.3" stroke-opacity="0.45"/>
      <!-- cuffs and hem: navy edge, twin needle -->
      <path d="M40,330 L90,350 M600,330 L550,350" stroke="#22406f" stroke-width="12"/>
      <g stroke="#9a948a" stroke-width="1.1" stroke-dasharray="3.2 1.6" stroke-opacity="0.7">
        <path d="M47,318 L96,338 M593,318 L544,338"/>
        <path d="M162,548 Q320,556 478,548 M162,543 Q320,551 478,543"/>
      </g>
    </g>
  </g>
</svg>
