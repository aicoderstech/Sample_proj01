<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600">
  <!-- Shot like a real product photo: garment on a plain white background,
       which the try-on studio removes automatically. -->
  <rect width="700" height="600" fill="#ffffff"/>
  <defs>
    <!-- Oxford cloth: a basket weave of white and blue yarn reads as a fine
         two-tone fleck. -->
    <filter id="oxford" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.95 0.6" numOctaves="2" seed="12" result="fleck"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.02" numOctaves="2" seed="3" result="mottle"/>
      <feComposite in="fleck" in2="mottle" operator="arithmetic" k2="0.7" k3="0.3" result="mix"/>
      <feColorMatrix in="mix" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 0.5" result="grey"/>
      <feComposite in="SourceGraphic" in2="grey" operator="arithmetic" k1="0.36" k2="0.91"/>
    </filter>
    <clipPath id="shape">
      <path d="M290,66 L225,95 L110,420 L170,442 L200,220 L198,520 Q350,536 502,520 L500,220 L530,442 L590,420 L475,95 L410,66 Z"/>
    </clipPath>
  </defs>
  <g filter="url(#oxford)">
    <path d="M290,66 L225,95 L110,420 L170,442 L200,220 L198,520 Q350,536 502,520 L500,220 L530,442 L590,420 L475,95 L410,66 Z" fill="#9fc3e6"/>
    <g clip-path="url(#shape)" fill="none">
      <!-- shoulder and sleeve seams (flat-felled: twin rows) -->
      <path d="M225,95 C210,140 203,180 200,220 M475,95 C490,140 497,180 500,220" stroke="#80a6cc" stroke-width="1.4"/>
      <path d="M231,97 C216,142 209,182 206,222 M469,97 C484,142 491,182 494,222" stroke="#86abd1" stroke-width="1" stroke-dasharray="3 1.5"/>
      <!-- placket -->
      <path d="M336,108 L336,528 M364,108 L364,528" stroke="#86abd1" stroke-width="1.1" stroke-dasharray="3 1.5"/>
      <path d="M350,108 L350,528" stroke="#7fa4ca" stroke-width="1.2" stroke-opacity="0.6"/>
      <!-- chest pocket -->
      <path d="M400,200 L460,200 L460,270 L430,282 L400,270 Z" fill="#9cc0e3" stroke="#7fa4ca" stroke-width="1.3"/>
      <path d="M404,208 L456,208" stroke="#86abd1" stroke-width="1" stroke-dasharray="3 1.5"/>
      <!-- shirt-tail hem -->
      <path d="M199,512 Q350,527 501,512" stroke="#86abd1" stroke-width="1" stroke-dasharray="3 1.5"/>
      <!-- cuffs -->
      <path d="M116,402 L174,422 L170,442 L110,420 Z M584,402 L526,422 L530,442 L590,420 Z" fill="#98bde2" stroke="#7fa4ca" stroke-width="1.3"/>
      <path d="M118,408 L172,427 M582,408 L528,427" stroke="#86abd1" stroke-width="1" stroke-dasharray="3 1.5"/>
    </g>
    <!-- collar: band and two points, with edge stitching -->
    <path d="M290,66 L350,110 L410,66 L400,50 L300,50 Z" fill="#a9cbec"/>
    <path d="M290,66 L350,110 L318,140 L282,90 Z M410,66 L350,110 L382,140 L418,90 Z" fill="#a6c9eb" stroke="#80a6cc" stroke-width="1.4"/>
    <path d="M292,72 L346,111 L318,134 L287,92 M408,72 L354,111 L382,134 L413,92" fill="none" stroke="#86abd1" stroke-width="1" stroke-dasharray="3 1.5"/>
  </g>
  <!-- buttons: four-hole, a little shadow under each -->
  <g>
    <g fill="#000" fill-opacity="0.12">
      <circle cx="351" cy="162" r="6.5"/><circle cx="351" cy="242" r="6.5"/><circle cx="351" cy="322" r="6.5"/>
      <circle cx="351" cy="402" r="6.5"/><circle cx="351" cy="482" r="6.5"/>
    </g>
    <g fill="#f3f1ec" stroke="#c9ccd1" stroke-width="1">
      <circle cx="350" cy="160" r="6"/><circle cx="350" cy="240" r="6"/><circle cx="350" cy="320" r="6"/>
      <circle cx="350" cy="400" r="6"/><circle cx="350" cy="480" r="6"/>
    </g>
    <g fill="#b4b8bf">
      <circle cx="348" cy="158" r="0.9"/><circle cx="352" cy="158" r="0.9"/><circle cx="348" cy="162" r="0.9"/><circle cx="352" cy="162" r="0.9"/>
      <circle cx="348" cy="238" r="0.9"/><circle cx="352" cy="238" r="0.9"/><circle cx="348" cy="242" r="0.9"/><circle cx="352" cy="242" r="0.9"/>
      <circle cx="348" cy="318" r="0.9"/><circle cx="352" cy="318" r="0.9"/><circle cx="348" cy="322" r="0.9"/><circle cx="352" cy="322" r="0.9"/>
      <circle cx="348" cy="398" r="0.9"/><circle cx="352" cy="398" r="0.9"/><circle cx="348" cy="402" r="0.9"/><circle cx="352" cy="402" r="0.9"/>
      <circle cx="348" cy="478" r="0.9"/><circle cx="352" cy="478" r="0.9"/><circle cx="348" cy="482" r="0.9"/><circle cx="352" cy="482" r="0.9"/>
    </g>
  </g>
</svg>
