<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560">
  <!-- Knife-pleated midi skirt in a soft twill. Each pleat is a panel that
       turns a little towards or away from the light. -->
  <defs>
    <filter id="twill" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8 0.5" numOctaves="2" seed="21" result="fine"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.012" numOctaves="3" seed="13" result="mottle"/>
      <feComposite in="fine" in2="mottle" operator="arithmetic" k2="0.55" k3="0.45" result="mix"/>
      <feColorMatrix in="mix" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 0.5" result="grey"/>
      <feComposite in="SourceGraphic" in2="grey" operator="arithmetic" k1="0.32" k2="0.92"/>
    </filter>
    <filter id="soft" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="shape"><path d="M175,20 L425,20 L425,64 L530,520 Q300,548 70,520 L175,64 Z"/></clipPath>
  </defs>
  <g filter="url(#twill)">
    <path d="M175,20 L425,20 L425,64 L530,520 Q300,548 70,520 L175,64 Z" fill="#c99459"/>
    <g clip-path="url(#shape)">
      <!-- pleats: the fold edge is lit, the panel under it in shadow -->
      <g fill="#7a5530" fill-opacity="0.2" filter="url(#soft)">
        <path d="M200,64 L110,540 L152,540 L225,64 Z M250,64 L195,540 L238,540 L275,64 Z M300,64 L300,540 L362,540 L325,64 Z M350,64 L405,540 L448,540 L375,64 Z M400,64 L490,540 L530,540 L425,64 Z"/>
      </g>
      <g stroke="#f2d3a8" stroke-opacity="0.4" stroke-width="1.6" fill="none">
        <path d="M200,64 L110,520 M250,64 L195,530 M300,64 L300,534 M350,64 L405,530 M400,64 L490,520"/>
      </g>
      <g stroke="#7a5530" stroke-opacity="0.45" stroke-width="1.6" fill="none">
        <path d="M225,64 L152,526 M275,64 L238,532 M325,64 L362,532 M375,64 L448,526"/>
      </g>
      <!-- waistband -->
      <rect x="175" y="20" width="250" height="44" fill="#b07d46"/>
      <path d="M175,26 L425,26 M175,58 L425,58" stroke="#8f6232" stroke-width="1" stroke-dasharray="3 1.5"/>
      <path d="M175,64 L425,64" stroke="#7a5530" stroke-width="1.6" stroke-opacity="0.6"/>
      <path d="M72,512 Q300,540 528,512" fill="none" stroke="#9c6f3d" stroke-width="1" stroke-dasharray="3 1.5" stroke-opacity="0.8"/>
    </g>
  </g>
  <circle cx="410" cy="42" r="6" fill="#ece0cc" stroke="#9c8462" stroke-width="1"/>
</svg>
