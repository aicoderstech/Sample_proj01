<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- Heather-grey fleece hoodie: flecked yarn, rib cuffs and hem. -->
  <defs>
    <filter id="heather" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.7 0.35" numOctaves="2" seed="8" result="fleck"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.025" numOctaves="3" seed="1" result="mottle"/>
      <feComposite in="fleck" in2="mottle" operator="arithmetic" k2="0.65" k3="0.35" result="mix"/>
      <feColorMatrix in="mix" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 0.5" result="grey"/>
      <feComposite in="SourceGraphic" in2="grey" operator="arithmetic" k1="0.56" k2="0.86"/>
    </filter>
    <clipPath id="shape">
      <path d="M232,118 L165,150 L58,520 L100,532 L150,240 L155,560 L160,600 L480,600 L485,560 L490,240 L540,532 L582,520 L475,150 L408,118 Z"/>
    </clipPath>
    <radialGradient id="hoodIn" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#4f535a"/>
      <stop offset="1" stop-color="#6c7077"/>
    </radialGradient>
  </defs>
  <g filter="url(#heather)">
    <path d="M232,118 L165,150 L58,520 L100,532 L150,240 L155,560 L160,600 L480,600 L485,560 L490,240 L540,532 L582,520 L475,150 L408,118 Z" fill="#a9acb2"/>
    <g clip-path="url(#shape)" fill="none">
      <!-- raglan-free set-in sleeve seams -->
      <path d="M165,150 C156,180 152,210 150,240 M475,150 C484,180 488,210 490,240" stroke="#868990" stroke-width="1.6"/>
      <!-- kangaroo pocket -->
      <path d="M215,420 L425,420 L455,530 L185,530 Z" fill="#a3a6ac" stroke="#868990" stroke-width="2"/>
      <path d="M220,425 L420,425 M190,525 L450,525" stroke="#8b8e95" stroke-width="1.1" stroke-dasharray="3 1.6"/>
      <path d="M215,420 L185,530 M425,420 L455,530" stroke="#7c7f86" stroke-width="3"/>
      <!-- rib hem and cuffs -->
      <path d="M155,560 L485,560 L480,600 L160,600 Z" fill="#9fa2a8"/>
      <path d="M155,580 L485,580" stroke="#8a8d94" stroke-width="40" stroke-dasharray="1.6 2.6" stroke-opacity="0.55"/>
      <path d="M156,561 L484,561" stroke="#878a91" stroke-width="1.6"/>
      <path d="M64,496 L104,508 L100,532 L58,520 Z M576,496 L536,508 L540,532 L582,520 Z" fill="#9fa2a8"/>
      <path d="M64,496 L104,508 M576,496 L536,508" stroke="#878a91" stroke-width="1.6"/>
    </g>
    <!-- hood lying behind the neck, its lining showing -->
    <path d="M232,118 C236,78 404,78 408,118 C380,150 260,150 232,118 Z" fill="#a1a4aa"/>
    <path d="M250,118 C268,148 372,148 390,118 C360,104 280,104 250,118 Z" fill="url(#hoodIn)"/>
    <path d="M236,116 C262,150 378,150 404,116" fill="none" stroke="#8b8e95" stroke-width="1.2" stroke-dasharray="3 1.6"/>
  </g>
  <!-- drawstrings with aglets (cotton cord, not fleece) -->
  <g stroke-linecap="round" fill="none">
    <path d="M292,140 Q288,195 286,244" stroke="#efefec" stroke-width="6"/>
    <path d="M348,140 Q352,195 354,244" stroke="#efefec" stroke-width="6"/>
    <path d="M286,244 L285.6,258 M354,244 L354.4,258" stroke="#b9bbbe" stroke-width="6.5"/>
  </g>
  <circle cx="292" cy="140" r="5" fill="#7b7e85"/>
  <circle cx="348" cy="140" r="5" fill="#7b7e85"/>
</svg>
