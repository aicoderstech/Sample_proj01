<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bcc2"/>
      <stop offset="1" stop-color="#8f939b"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.14"/>
      <stop offset="0.22" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <!-- body + sleeves -->
  <path d="M232,118 L165,150 L58,520 L100,532 L150,240 L155,560 L160,600 L480,600 L485,560 L490,240 L540,532 L582,520 L475,150 L408,118 Z" fill="url(#body)"/>
